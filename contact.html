
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Student Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <p>We are happy to hear from you</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="registration.html">Registration</a>
        <a href="courses.html">Courses</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <h2>Get in Touch</h2>
        <p>Email: studentportal@example.com</p>
        <p>Office: Student Administration Department</p>

        <h2>Send a Message</h2>
        <form>
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <p>Note: This demonstration form does not send messages.</p>
    </main>

    <footer>
        <p>&copy; 2026 Student Management Portal</p>
    </footer>
</body>
</html>
